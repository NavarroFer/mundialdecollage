name: Apply Supabase migrations

# Called from ci.yml after the checks pass, so production never gets a schema
# change from a commit whose tests failed. workflow_dispatch stays for re-running
# a push by hand. `supabase db push` is a no-op when nothing is pending, so it is
# safe to run before every production deploy.
on:
  workflow_call:
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: true
      SUPABASE_DB_PASSWORD:
        required: true
  workflow_dispatch: {}

env:
  SUPABASE_PROJECT_ID: jgneduoejygbqtwarynr

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Newer CLIs target the local stack by default; --remote points at the
      # project linked above.
      - name: Apply pending migrations
        run: supabase db push --remote --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
