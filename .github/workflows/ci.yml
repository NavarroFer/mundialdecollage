name: CI

# Checks only. Production runs on GV Cloud and is deployed by hand (SFTP +
# reiniciar.txt, see docs/migracion-gv-cloud.md), so this workflow no longer
# triggers a Vercel deploy nor applies migrations to the old Supabase project.
on:
  push:
    branches: [main]
  pull_request: {}
  # Re-runs the checks by hand.
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx next typegen

      - run: npx tsc --noEmit

      - run: npm test

      # No Supabase/Mercado Pago env vars on purpose: isSupabaseConfigured and
      # isMercadoPagoConfigured (lib/supabase/config.ts, lib/mercadopago.ts)
      # gate everything that touches those services, so the build takes the
      # same "not configured yet" path CI needs — real credentials here would
      # make build-time data fetches (e.g. app/sitemap.ts) hit a fake host.
      - run: npm run build
